<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Error de solicitud')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 680px;">
    <div class="eco-card text-center py-5 px-4">
      <div class="text-warning display-4 fw-bold mb-2"
           th:text="${codigo != null ? codigo : (status != null ? status : 'Error')}">Error</div>
      <h1 class="h4 fw-bold text-white mb-2">No se pudo completar la operación</h1>
      <p class="text-eco-muted mb-4"
         th:text="${detalle != null ? detalle : 'Ocurrió un inconveniente al procesar tu solicitud. Intenta nuevamente.'}"></p>
      <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a class="btn btn-eco" th:href="@{/}">
          <i class="bi bi-house-door me-1"></i> Volver al inicio
        </a>
        <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
          Regresar
        </button>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
