<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Materiales reciclables')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('materiales')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 960px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <span class="eco-pill mb-2">Catálogo activo</span>
        <h1 class="h3 fw-bold text-white mb-1">Materiales reciclables</h1>
        <p class="text-eco-muted mb-0">Materiales habilitados actualmente en la base de datos EcoPuntos VES.</p>
      </div>
      <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">
        <i class="bi bi-arrow-left me-1"></i> Volver al inicio
      </a>
    </div>

    <div class="eco-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th style="width: 120px;">Código</th>
              <th>Material</th>
              <th style="width: 140px;">Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="material : ${materiales}">
              <td class="text-eco-muted" th:text="${material.id}">1</td>
              <td class="fw-semibold text-white" th:text="${material.nombre}">Plástico</td>
              <td><span class="badge badge-neon">Activo</span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(materiales)}">
              <td colspan="3" class="text-center text-eco-muted py-4">No hay materiales activos.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
