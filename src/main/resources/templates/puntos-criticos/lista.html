<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puntos críticos | EcoPuntos VES</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
<main class="container bg-white rounded shadow-sm my-4 p-4">
<nav class="d-flex gap-3 flex-wrap align-items-center mb-4">
 <a th:href="@{/}">Inicio</a><a th:href="@{/materiales}">Materiales</a>
 <a th:href="@{/entregas}">Entregas</a><a th:href="@{/puntos-criticos}">Puntos críticos</a>
 <a th:href="@{/cambiar-clave}">Cambiar clave</a>
 <form method="post" th:action="@{/logout}" class="m-0"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-sm btn-outline-secondary">Salir</button></form>
</nav>
<h1 class="h3">Gestión de puntos críticos</h1>
<p class="text-secondary">Consulta y atención de reportes de residuos sólidos por funcionarios municipales.</p>
<form method="get" th:action="@{/puntos-criticos}" class="row g-3 align-items-end mb-4">
 <div class="col-md-5"><label for="sectorId" class="form-label">Sector</label>
  <select class="form-select" id="sectorId" name="sectorId">
   <option value="">Todos los sectores</option>
   <option th:each="s : ${sectores}" th:value="${s.id}" th:text="${s.nombre}" th:selected="${sectorId != null and sectorId == s.id}"></option>
  </select>
 </div>
 <div class="col-md-5"><label for="estado" class="form-label">Estado</label>
  <select class="form-select" id="estado" name="estado">
   <option value="">Todos los estados</option>
   <option value="REPORTADO" th:selected="${estado == 'REPORTADO'}">REPORTADO</option>
   <option value="VALIDADO" th:selected="${estado == 'VALIDADO'}">VALIDADO</option>
   <option value="RECHAZADO" th:selected="${estado == 'RECHAZADO'}">RECHAZADO</option>
   <option value="EN_ATENCION" th:selected="${estado == 'EN_ATENCION'}">EN_ATENCION</option>
   <option value="RESUELTO" th:selected="${estado == 'RESUELTO'}">RESUELTO</option>
  </select>
 </div>
 <div class="col-md-2"><button type="submit" class="btn btn-success w-100">Filtrar</button></div>
</form>
<div class="table-responsive"><table class="table table-hover table-sm align-middle">
 <thead class="table-success"><tr><th>N.º</th><th>Fecha</th><th>Sector</th><th>Ubicación</th><th>Estado</th><th>Acción</th></tr></thead>
 <tbody>
  <tr th:each="r : ${reportes.content}"><td th:text="${r.id}"></td>
   <td th:text="${#temporals.format(r.fechaHora,'dd/MM/yyyy HH:mm')}"></td>
   <td th:text="${r.sector.nombre}"></td>
   <td th:text="${r.direccionReferencia}"></td>
   <td><span class="badge text-bg-secondary" th:text="${r.estado}"></span></td>
   <td><a th:href="@{/puntos-criticos/{id}(id=${r.id})}">Detalle</a></td>
  </tr>
  <tr th:if="${reportes.empty}"><td colspan="6">No hay reportes con estos filtros.</td></tr>
 </tbody></table></div>
<div class="d-flex gap-3 align-items-center mt-3">
 <a th:if="${reportes.hasPrevious()}" th:href="@{/puntos-criticos(sectorId=${sectorId},estado=${estado},page=${reportes.number-1})}">Anterior</a>
 <span th:text="|Página ${reportes.number + 1} de ${reportes.totalPages == 0 ? 1 : reportes.totalPages} · ${reportes.totalElements} registros|"></span>
 <a th:if="${reportes.hasNext()}" th:href="@{/puntos-criticos(sectorId=${sectorId},estado=${estado},page=${reportes.number+1})}">Siguiente</a>
</div>
</main></body></html>
