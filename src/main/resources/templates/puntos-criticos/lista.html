<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Puntos críticos')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('puntos-criticos')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 1180px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h3 fw-bold text-white mb-1">Gestión de puntos críticos</h1>
        <p class="text-eco-muted mb-0">Consulta, evaluación y seguimiento de reportes ciudadanos de residuos sólidos.</p>
      </div>
      <span class="badge badge-neon fs-6" th:text="|Total filtrado: ${reportes.totalElements}|">Total filtrado: 0</span>
    </div>

    <div th:if="${error}" class="alert alert-warning mb-3" th:text="${error}"></div>

    <!-- Tarjetas de totales por estado -->
    <div class="row row-cols-2 row-cols-md-5 g-3 mb-4">
      <div class="col">
        <div class="eco-kpi-card py-3">
          <div class="text-eco-muted small mb-1">Reportados</div>
          <div class="h3 fw-bold text-white mb-0" th:text="${totales['REPORTADO']}">0</div>
        </div>
      </div>
      <div class="col">
        <div class="eco-kpi-card py-3">
          <div class="text-eco-muted small mb-1">Validados</div>
          <div class="h3 fw-bold text-info mb-0" th:text="${totales['VALIDADO']}">0</div>
        </div>
      </div>
      <div class="col">
        <div class="eco-kpi-card py-3">
          <div class="text-eco-muted small mb-1">En atención</div>
          <div class="h3 fw-bold text-warning mb-0" th:text="${totales['EN_ATENCION']}">0</div>
        </div>
      </div>
      <div class="col">
        <div class="eco-kpi-card py-3">
          <div class="text-eco-muted small mb-1">Resueltos</div>
          <div class="h3 fw-bold text-eco-neon mb-0" th:text="${totales['RESUELTO']}">0</div>
        </div>
      </div>
      <div class="col">
        <div class="eco-kpi-card py-3">
          <div class="text-eco-muted small mb-1">Rechazados</div>
          <div class="h3 fw-bold text-danger mb-0" th:text="${totales['RECHAZADO']}">0</div>
        </div>
      </div>
    </div>

    <!-- Filtros: Sector, Estado, Desde y Hasta -->
    <div class="eco-card mb-4">
      <form method="get" th:action="@{/puntos-criticos}" class="row g-3 align-items-end">
        <div class="col-6 col-lg-3">
          <label for="sectorId" class="form-label">Sector</label>
          <select class="form-select" id="sectorId" name="sectorId">
            <option value="">Todos los sectores</option>
            <option th:each="s : ${sectores}" th:value="${s.id}" th:text="${s.nombre}"
                    th:selected="${sectorId != null and sectorId == s.id}"></option>
          </select>
        </div>
        <div class="col-6 col-lg-3">
          <label for="estado" class="form-label">Estado</label>
          <select class="form-select" id="estado" name="estado">
            <option value="">Todos los estados</option>
            <option value="REPORTADO" th:selected="${estado == 'REPORTADO'}">REPORTADO</option>
            <option value="VALIDADO" th:selected="${estado == 'VALIDADO'}">VALIDADO</option>
            <option value="RECHAZADO" th:selected="${estado == 'RECHAZADO'}">RECHAZADO</option>
            <option value="EN_ATENCION" th:selected="${estado == 'EN_ATENCION'}">EN_ATENCION</option>
            <option value="RESUELTO" th:selected="${estado == 'RESUELTO'}">RESUELTO</option>
          </select>
        </div>
        <div class="col-6 col-lg-2">
          <label for="desde" class="form-label">Desde</label>
          <input type="date" class="form-control" id="desde" name="desde" th:value="${desde}">
        </div>
        <div class="col-6 col-lg-2">
          <label for="hasta" class="form-label">Hasta</label>
          <input type="date" class="form-control" id="hasta" name="hasta" th:value="${hasta}">
        </div>
        <div class="col-12 col-lg-2 d-flex gap-2">
          <button type="submit" class="btn btn-eco w-100">
            <i class="bi bi-funnel me-1"></i> Filtrar
          </button>
          <a th:if="${sectorId != null or !#strings.isEmpty(estado) or !#strings.isEmpty(desde) or !#strings.isEmpty(hasta)}"
             class="btn btn-outline-secondary" th:href="@{/puntos-criticos}" title="Limpiar filtros">
            <i class="bi bi-x-lg"></i>
          </a>
        </div>
      </form>
    </div>

    <!-- Tabla de resultados -->
    <div class="eco-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>N.º</th>
              <th>Fecha</th>
              <th>Sector</th>
              <th>Ubicación</th>
              <th>Estado</th>
              <th class="text-end">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${reportes.content}">
              <td class="text-eco-muted" th:text="${r.id}"></td>
              <td th:text="${#temporals.format(r.fechaHora,'dd/MM/yyyy HH:mm')}"></td>
              <td><span class="badge bg-dark border border-secondary text-light" th:text="${r.sector.nombre}"></span></td>
              <td class="text-white" th:text="${r.direccionReferencia}"></td>
              <td>
                <span th:class="${r.estado == 'RESUELTO' ? 'badge badge-neon' : (r.estado == 'EN_ATENCION' ? 'badge text-bg-warning' : (r.estado == 'VALIDADO' ? 'badge text-bg-info' : (r.estado == 'RECHAZADO' ? 'badge text-bg-danger' : 'badge text-bg-secondary')))}"
                      th:text="${r.estado}"></span>
              </td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-eco" th:href="@{/puntos-criticos/{id}(id=${r.id})}">Detalle</a>
              </td>
            </tr>
            <tr th:if="${reportes.empty}">
              <td colspan="6" class="text-center text-eco-muted py-4">No hay reportes con estos filtros.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex gap-3 align-items-center mt-3 pt-3 border-top border-secondary-subtle">
        <a class="btn btn-outline-secondary btn-sm" th:if="${reportes.hasPrevious()}"
           th:href="@{/puntos-criticos(sectorId=${sectorId},estado=${estado},desde=${desde},hasta=${hasta},page=${reportes.number - 1})}">Anterior</a>
        <span class="small text-eco-muted"
              th:text="|Página ${reportes.number + 1} de ${reportes.totalPages == 0 ? 1 : reportes.totalPages} · ${reportes.totalElements} registros|"></span>
        <a class="btn btn-outline-secondary btn-sm" th:if="${reportes.hasNext()}"
           th:href="@{/puntos-criticos(sectorId=${sectorId},estado=${estado},desde=${desde},hasta=${hasta},page=${reportes.number + 1})}">Siguiente</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
