<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Mis reportes')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('mis-reportes')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 1100px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h3 fw-bold text-white mb-1">Mis reportes de puntos críticos</h1>
        <p class="text-eco-muted mb-0">Consulta el estado de tus incidencias reportadas (máximo 3 por día).</p>
      </div>
      <a th:href="@{/puntos-criticos/nuevo}" class="btn btn-eco">
        <i class="bi bi-plus-circle me-1"></i> Nuevo reporte
      </a>
    </div>

    <div class="eco-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>N.º</th>
              <th>Fecha</th>
              <th>Sector</th>
              <th>Dirección</th>
              <th>Estado</th>
              <th class="text-end">Detalle</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${reportes.content}">
              <td class="text-eco-muted" th:text="${r.id}"></td>
              <td th:text="${#temporals.format(r.fechaHora,'dd/MM/yyyy HH:mm')}"></td>
              <td><span class="badge bg-dark border border-secondary text-light" th:text="${r.sector.nombre}"></span></td>
              <td class="text-white" th:text="${r.direccionReferencia}"></td>
              <td>
                <span th:class="${r.estado == 'RESUELTO' ? 'badge badge-neon' : (r.estado == 'EN_ATENCION' ? 'badge text-bg-warning' : (r.estado == 'VALIDADO' ? 'badge text-bg-info' : (r.estado == 'RECHAZADO' ? 'badge text-bg-danger' : 'badge text-bg-secondary')))}"
                      th:text="${r.estado}"></span>
              </td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-eco" th:href="@{/puntos-criticos/{id}(id=${r.id})}">Ver</a>
              </td>
            </tr>
            <tr th:if="${reportes.empty}">
              <td colspan="6" class="text-center text-eco-muted py-4">Todavía no has creado reportes.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex gap-3 align-items-center mt-3 pt-3 border-top border-secondary-subtle">
        <a class="btn btn-outline-secondary btn-sm" th:if="${reportes.hasPrevious()}"
           th:href="@{/puntos-criticos/mis-reportes(page=${reportes.number - 1})}">Anterior</a>
        <span class="small text-eco-muted"
              th:text="|Página ${reportes.number + 1} de ${reportes.totalPages == 0 ? 1 : reportes.totalPages}|"></span>
        <a class="btn btn-outline-secondary btn-sm" th:if="${reportes.hasNext()}"
           th:href="@{/puntos-criticos/mis-reportes(page=${reportes.number + 1})}">Siguiente</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
