<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis reportes | EcoPuntos VES</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container bg-white rounded shadow-sm my-4 p-4">
<nav class="d-flex gap-3 flex-wrap align-items-center mb-4"><a th:href="@{/}">Inicio</a>
<a th:href="@{/mi-perfil}">Mi perfil</a><a th:href="@{/mis-entregas}">Mis entregas</a>
<a th:href="@{/puntos-criticos/mis-reportes}">Mis reportes</a>
<form method="post" th:action="@{/logout}" class="m-0"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Salir</button></form></nav>
<h1 class="h3">Mis reportes de puntos críticos</h1>
<p class="text-secondary">Puedes crear reportes y consultar su estado. Máximo 3 por día.</p>
<p><a th:href="@{/puntos-criticos/nuevo}" class="btn btn-success">+ Nuevo reporte</a></p>
<div class="table-responsive"><table class="table table-hover align-middle">
<thead class="table-success"><tr><th>N.º</th><th>Fecha</th><th>Sector</th><th>Dirección</th><th>Estado</th><th>Detalle</th></tr></thead>
<tbody><tr th:each="r : ${reportes.content}">
<td th:text="${r.id}"></td><td th:text="${#temporals.format(r.fechaHora,'dd/MM/yyyy HH:mm')}"></td>
<td th:text="${r.sector.nombre}"></td><td th:text="${r.direccionReferencia}"></td>
<td><span class="badge text-bg-secondary" th:text="${r.estado}"></span></td>
<td><a th:href="@{/puntos-criticos/{id}(id=${r.id})}">Ver</a></td></tr>
<tr th:if="${reportes.empty}"><td colspan="6">Todavía no has creado reportes.</td></tr></tbody></table></div>
<div class="d-flex gap-3"><a th:if="${reportes.hasPrevious()}" th:href="@{/puntos-criticos/mis-reportes(page=${reportes.number-1})}">Anterior</a>
<span th:text="|Página ${reportes.number+1} de ${reportes.totalPages==0 ? 1 : reportes.totalPages}|"></span>
<a th:if="${reportes.hasNext()}" th:href="@{/puntos-criticos/mis-reportes(page=${reportes.number+1})}">Siguiente</a></div>
</main></body></html>
