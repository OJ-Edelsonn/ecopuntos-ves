<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuadrillas y personal | EcoPuntos VES</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container bg-white rounded shadow-sm my-4 p-4" style="max-width:1150px">
<nav class="d-flex flex-wrap gap-3 mb-4"><a th:href="@{/}">Inicio</a>
<a th:href="@{/puntos-criticos}">Puntos críticos</a><a th:href="@{/reportes}">Reportes</a></nav>
<h1 class="h3">Cuadrillas y personal de limpieza</h1>
<p class="text-secondary">Catálogo de equipos responsables de las atenciones municipales.</p>
<div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<h2 class="h5 mt-4">Cuadrillas registradas</h2>
<div class="table-responsive"><table class="table table-sm table-striped align-middle"><thead><tr>
<th>ID</th><th>Cuadrilla</th><th>Sector de referencia</th><th>Estado</th><th th:if="${esAdmin}">Acción</th>
</tr></thead><tbody><tr th:each="c : ${cuadrillas}">
<td th:text="${c.id}"></td><td th:text="${c.nombre}"></td>
<td th:text="${c.sector == null ? 'Sin sector fijo' : c.sector.nombre}"></td>
<td><span th:class="${c.activo ? 'badge text-bg-success' : 'badge text-bg-secondary'}" th:text="${c.activo ? 'Activa' : 'Inactiva'}"></span></td>
<td th:if="${esAdmin}"><form method="post" th:action="@{/cuadrillas/{id}/estado(id=${c.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input type="hidden" name="activo" th:value="${!c.activo}">
<button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${c.activo ? 'Desactivar' : 'Activar'}"></button></form></td>
</tr></tbody></table></div>
<div class="card my-4" th:if="${esAdmin}"><div class="card-body"><h2 class="h5">Crear cuadrilla</h2>
<form method="post" th:action="@{/cuadrillas/nueva}" class="row g-3">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="col-md-6"><label for="nombreCuadrilla" class="form-label">Nombre</label>
<input id="nombreCuadrilla" name="nombre" class="form-control" maxlength="100" required></div>
<div class="col-md-4"><label for="sectorId" class="form-label">Sector de referencia (opcional)</label>
<select id="sectorId" name="sectorId" class="form-select"><option value="">Sin sector fijo</option>
<option th:each="s:${sectores}" th:value="${s.id}" th:text="${s.nombre}"></option></select></div>
<div class="col-md-2 d-flex align-items-end"><button class="btn btn-success w-100">Registrar</button></div>
</form></div></div>
<h2 class="h5 mt-4">Integrantes registrados</h2>
<div class="table-responsive"><table class="table table-sm table-striped align-middle"><thead><tr>
<th>Persona</th><th>Cuadrilla</th><th>Cargo</th><th>Estado</th><th th:if="${esAdmin}">Acción</th>
</tr></thead><tbody><tr th:each="p:${miembros}">
<td th:text="${p.nombreCompleto}"></td><td th:text="${p.cuadrilla.nombre}"></td>
<td th:text="${p.cargo}"></td><td th:text="${p.activo ? 'Activo' : 'Inactivo'}"></td>
<td th:if="${esAdmin}"><form method="post" th:action="@{/cuadrillas/miembros/{id}/estado(id=${p.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input type="hidden" name="activo" th:value="${!p.activo}">
<button class="btn btn-sm btn-outline-secondary" th:text="${p.activo ? 'Desactivar' : 'Activar'}"></button></form></td>
</tr></tbody></table></div>
<div class="card my-4" th:if="${esAdmin}"><div class="card-body"><h2 class="h5">Registrar integrante</h2>
<form method="post" th:action="@{/cuadrillas/miembros/nuevo}" class="row g-3">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="col-md-6"><label for="cuadrillaMiembro" class="form-label">Cuadrilla</label>
<select id="cuadrillaMiembro" name="cuadrillaId" class="form-select" required><option value="">Seleccione...</option>
<option th:each="c:${cuadrillas}" th:if="${c.activo}" th:value="${c.id}" th:text="${c.nombre}"></option></select></div>
<div class="col-md-3"><label for="nombres" class="form-label">Nombres</label><input id="nombres" name="nombres" class="form-control" maxlength="80" required></div>
<div class="col-md-3"><label for="apellidos" class="form-label">Apellidos</label><input id="apellidos" name="apellidos" class="form-control" maxlength="80" required></div>
<div class="col-md-8"><label for="cargo" class="form-label">Cargo</label><input id="cargo" name="cargo" class="form-control" maxlength="70" required></div>
<div class="col-md-4 d-flex align-items-end"><button class="btn btn-success w-100">Agregar integrante</button></div>
</form></div></div>
</main></body></html>
