<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Ficha de vecino')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('vecinos')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 860px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <span class="eco-pill mb-2">Ficha ciudadana</span>
        <h1 class="h3 fw-bold text-white mb-0" th:text="${vecino.usuario.nombreCompleto}">Vecino</h1>
      </div>
      <a class="btn btn-outline-secondary btn-sm" th:href="@{/vecinos}">
        <i class="bi bi-arrow-left me-1"></i> Volver al listado
      </a>
    </div>

    <div th:if="${mensaje}" class="alert alert-eco mb-3" th:text="${mensaje}"></div>

    <div class="eco-card mb-4">
      <div class="table-responsive">
        <table class="table table-bordered align-middle">
          <tbody>
            <tr>
              <th class="eco-th-label" style="width: 34%;">Nombre completo</th>
              <td class="text-white fw-semibold" th:text="${vecino.usuario.nombreCompleto}"></td>
            </tr>
            <tr>
              <th class="eco-th-label">DNI</th>
              <td th:text="${vecino.dni}"></td>
            </tr>
            <tr>
              <th class="eco-th-label">Usuario de acceso</th>
              <td><code class="text-eco-neon" th:text="${vecino.usuario.username}"></code></td>
            </tr>
            <tr>
              <th class="eco-th-label">Sector</th>
              <td><span class="badge badge-neon" th:text="${vecino.sector.nombre}"></span></td>
            </tr>
            <tr>
              <th class="eco-th-label">Dirección</th>
              <td th:text="${vecino.direccion}"></td>
            </tr>
            <tr>
              <th class="eco-th-label">Teléfono</th>
              <td th:text="${vecino.telefono ?: '-'}"></td>
            </tr>
            <tr>
              <th class="eco-th-label">Código de contribuyente</th>
              <td th:text="${vecino.codigoContribuyente ?: '-'}"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex flex-wrap gap-2 mt-4">
        <a class="btn btn-eco" th:href="@{/vecinos/{id}/editar(id=${vecino.id})}">
          <i class="bi bi-pencil-square me-1"></i> Editar datos de contacto
        </a>
        <a class="btn btn-outline-eco" th:href="@{/entregas/nueva(dni=${vecino.dni})}">
          <i class="bi bi-plus-circle me-1"></i> Registrar entrega para este vecino
        </a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
