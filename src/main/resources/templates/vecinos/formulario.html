<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Registrar vecino')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('vecinos')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 860px;">
    <div class="mb-4">
      <h1 class="h3 fw-bold text-white mb-1">Registrar vecino</h1>
      <p class="text-eco-muted mb-0">
        Se creará automáticamente la cuenta con usuario <code class="text-eco-neon">v+DNI</code> y una clave temporal aleatoria.
      </p>
    </div>

    <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>

    <div class="eco-card">
      <form th:action="@{/vecinos/nuevo}" th:object="${form}" method="post" class="row g-3">
        <div class="col-md-4">
          <label for="dni" class="form-label">DNI (8 dígitos)</label>
          <input id="dni" class="form-control" th:field="*{dni}" required
                 pattern="[0-9]{8}" maxlength="8" inputmode="numeric" placeholder="Ej.: 71234567">
        </div>
        <div class="col-md-4">
          <label for="nombres" class="form-label">Nombres</label>
          <input id="nombres" class="form-control" th:field="*{nombres}" required maxlength="80">
        </div>
        <div class="col-md-4">
          <label for="apellidos" class="form-label">Apellidos</label>
          <input id="apellidos" class="form-control" th:field="*{apellidos}" required maxlength="80">
        </div>
        <div class="col-md-8">
          <label for="direccion" class="form-label">Dirección</label>
          <input id="direccion" class="form-control" th:field="*{direccion}" required maxlength="150"
                 placeholder="Ej.: Grupo 16 Mz 38 Lt 1 - Sector 1">
        </div>
        <div class="col-md-4">
          <label for="sectorId" class="form-label">Sector</label>
          <select id="sectorId" class="form-select" th:field="*{sectorId}" required>
            <option value="">Seleccionar sector...</option>
            <option th:each="s : ${sectores}" th:value="${s.id}" th:text="${s.nombre}"></option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="telefono" class="form-label">Teléfono (opcional)</label>
          <input id="telefono" class="form-control" th:field="*{telefono}" maxlength="15" inputmode="tel"
                 placeholder="Ej.: 987654321">
        </div>
        <div class="col-md-6">
          <label for="codigoContribuyente" class="form-label">Código de contribuyente (opcional)</label>
          <input id="codigoContribuyente" class="form-control" th:field="*{codigoContribuyente}" maxlength="20"
                 placeholder="Ej.: COD-00351">
        </div>

        <div class="col-12 d-flex gap-2 mt-3 pt-3 border-top border-secondary-subtle">
          <button type="submit" class="btn btn-eco">
            <i class="bi bi-check-lg me-1"></i> Guardar vecino
          </button>
          <a class="btn btn-outline-secondary" th:href="@{/vecinos}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
