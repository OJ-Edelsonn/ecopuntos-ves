<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Mi perfil')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('perfil')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 860px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <span class="eco-pill mb-2">Cuenta vecinal</span>
        <h1 class="h3 fw-bold text-white mb-1">Mi perfil</h1>
        <p class="text-eco-muted mb-0">Información personal y resumen de saldo disponible.</p>
      </div>
      <div class="eco-card-neon py-2 px-4">
        <div class="text-eco-muted small">Saldo disponible</div>
        <div class="h4 fw-bold text-eco-neon mb-0" th:text="|${saldo} puntos|">0 puntos</div>
      </div>
    </div>

    <div class="eco-card">
      <div class="table-responsive">
        <table class="table table-bordered align-middle">
          <tbody>
            <tr>
              <th class="eco-th-label" style="width: 36%;">Nombres y apellidos</th>
              <td class="text-white fw-semibold" th:text="${vecino.usuario.nombreCompleto}"></td>
            </tr>
            <tr>
              <th class="eco-th-label">Usuario</th>
              <td><code class="text-eco-neon" th:text="${vecino.usuario.username}"></code></td>
            </tr>
            <tr>
              <th class="eco-th-label">DNI</th>
              <td th:text="${vecino.dni}"></td>
            </tr>
            <tr>
              <th class="eco-th-label">Sector</th>
              <td><span class="badge badge-neon" th:text="${vecino.sector.nombre}"></span></td>
            </tr>
            <tr>
              <th class="eco-th-label">Dirección</th>
              <td th:text="${vecino.direccion}"></td>
            </tr>
            <tr>
              <th class="eco-th-label">Teléfono</th>
              <td th:text="${vecino.telefono ?: '-'}"></td>
            </tr>
            <tr>
              <th class="eco-th-label">Código de contribuyente</th>
              <td th:text="${vecino.codigoContribuyente != null and !#strings.isEmpty(vecino.codigoContribuyente) ? vecino.codigoContribuyente : 'Sin registrar'}"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex flex-wrap gap-2 mt-4">
        <a class="btn btn-eco btn-sm" th:href="@{/mis-puntos}">
          <i class="bi bi-stars me-1"></i> Ver mis puntos
        </a>
        <a class="btn btn-outline-eco btn-sm" th:href="@{/mis-entregas}">
          <i class="bi bi-bag-check me-1"></i> Mis entregas
        </a>
        <a class="btn btn-outline-eco btn-sm" th:href="@{/canjes}">
          <i class="bi bi-ticket-perforated me-1"></i> Canjes
        </a>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/cambiar-clave}">
          <i class="bi bi-key me-1"></i> Cambiar contraseña
        </a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
