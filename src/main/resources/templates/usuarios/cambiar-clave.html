<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Cambiar contraseña')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('clave')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 560px;">
    <div class="mb-4">
      <h1 class="h3 fw-bold text-white mb-1">Cambiar contraseña</h1>
      <p class="text-eco-muted mb-0">
        Si acabas de recibir una clave temporal, debes actualizarla antes de operar en el sistema.
      </p>
    </div>

    <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>

    <div class="eco-card">
      <form method="post" th:action="@{/cambiar-clave}">
        <div class="mb-3">
          <label for="actual" class="form-label">Contraseña actual</label>
          <input id="actual" type="password" name="actual" class="form-control"
                 required autocomplete="current-password">
        </div>
        <div class="mb-3">
          <label for="nueva" class="form-label">Nueva contraseña</label>
          <input id="nueva" type="password" name="nueva" class="form-control"
                 required minlength="10" maxlength="72" autocomplete="new-password">
          <div class="form-text">Entre 10 y 72 caracteres, combinando letras y números.</div>
        </div>
        <div class="mb-4">
          <label for="confirmacion" class="form-label">Confirmar nueva contraseña</label>
          <input id="confirmacion" type="password" name="confirmacion" class="form-control"
                 required minlength="10" maxlength="72" autocomplete="new-password">
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-eco">
            <i class="bi bi-shield-check me-1"></i> Actualizar contraseña
          </button>
          <a class="btn btn-outline-secondary" th:href="@{/}">Volver</a>
        </div>
      </form>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
