<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña | EcoPuntos VES</title>

<style>
  :root {font-family:Arial,sans-serif;color:#1f2937;background:#f4f7f6}
  body {margin:0} main {max-width:1050px;margin:25px auto;padding:24px;background:white;border-radius:12px;box-shadow:0 2px 14px #0001}
  h1 {font-size:1.6rem;margin-top:0} h2 {font-size:1.1rem}
  a {color:#087f5b} nav {display:flex;gap:12px;flex-wrap:wrap;margin:0 0 22px}
  table {width:100%;border-collapse:collapse} th,td {text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}
  th {background:#eaf5ed} label {display:block;margin:12px 0 4px;font-weight:600}
  input,select {box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9c5c0;border-radius:6px}
  button,.boton {display:inline-block;width:auto;padding:10px 16px;border:0;border-radius:6px;background:#087f5b;color:#fff;text-decoration:none;cursor:pointer}
  .alerta {padding:13px;margin:14px 0;border-radius:6px;background:#fff5d7}
  .error {background:#fee2e2} .campos {display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .paginacion {display:flex;gap:15px;margin-top:15px} .ayuda {color:#52615c;font-size:14px}
  form.linea {display:inline} form.linea button {background:#455a64;padding:6px 9px}
</style>
</head><body><main><nav><a th:href="@{/}">Inicio</a></nav><h1>Cambiar contraseña</h1><p class="ayuda">Si acabas de recibir una clave temporal, debes cambiarla para continuar.</p><div th:if="${error}" class="alerta error" th:text="${error}"></div>
<form method="post" th:action="@{/cambiar-clave}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="actual">Contraseña actual</label><input id="actual" type="password" name="actual" required autocomplete="current-password"><label for="nueva">Nueva contraseña (mínimo 10 caracteres, letras y números)</label><input id="nueva" type="password" name="nueva" required minlength="10" maxlength="72" autocomplete="new-password"><label for="confirmacion">Confirmar contraseña</label><input id="confirmacion" type="password" name="confirmacion" required minlength="10" maxlength="72" autocomplete="new-password"><p><button type="submit">Actualizar contraseña</button></p></form>
<form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Cerrar sesión</button></form>
</main></body></html>
