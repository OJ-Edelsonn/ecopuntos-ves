<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal | EcoPuntos VES</title>

<style>
  :root {font-family:Arial,sans-serif;color:#1f2937;background:#f4f7f6}
  body {margin:0} main {max-width:1050px;margin:25px auto;padding:24px;background:white;border-radius:12px;box-shadow:0 2px 14px #0001}
  h1 {font-size:1.6rem;margin-top:0} h2 {font-size:1.1rem}
  a {color:#087f5b} nav {display:flex;gap:12px;flex-wrap:wrap;margin:0 0 22px}
  table {width:100%;border-collapse:collapse} th,td {text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}
  th {background:#eaf5ed} label {display:block;margin:12px 0 4px;font-weight:600}
  input,select {box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9c5c0;border-radius:6px}
  button,.boton {display:inline-block;width:auto;padding:10px 16px;border:0;border-radius:6px;background:#087f5b;color:#fff;text-decoration:none;cursor:pointer}
  .alerta {padding:13px;margin:14px 0;border-radius:6px;background:#fff5d7}
  .error {background:#fee2e2} .campos {display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .paginacion {display:flex;gap:15px;margin-top:15px} .ayuda {color:#52615c;font-size:14px}
  form.linea {display:inline} form.linea button {background:#455a64;padding:6px 9px}
</style>
</head><body><main><nav><a th:href="@{/}">Inicio</a><a th:href="@{/vecinos}">Vecinos</a><form class="linea" method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Salir</button></form></nav><h1>Personal del sistema</h1><p><a class="boton" th:href="@{/usuarios/nuevo}">Crear cuenta de personal</a></p>
<div th:if="${mensaje}" class="alerta" th:text="${mensaje}"></div><div th:if="${error}" class="alerta error" th:text="${error}"></div>
<div th:if="${usuarioCreado}" class="alerta">Usuario nuevo: <strong th:text="${usuarioCreado}"></strong> | Clave temporal (una sola vez): <strong th:text="${claveTemporal}"></strong><p>Compartir por un canal privado. Se exigirá cambio al iniciar sesión.</p></div>
<table><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
<tr th:each="u:${usuarios.content}"><td th:text="${u.username}"></td><td th:text="${u.nombreCompleto}"></td><td th:text="${u.rol.nombre}"></td><td th:text="${u.activo ? 'Activo' : 'Inactivo'}"></td><td><form class="linea" method="post" th:action="@{/usuarios/{id}/estado(id=${u.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" th:text="${u.activo ? 'Desactivar' : 'Activar'}"></button></form></td></tr>
</tbody></table><div class="paginacion"><a th:if="${usuarios.hasPrevious()}" th:href="@{/usuarios(page=${usuarios.number-1})}">Anterior</a><span th:text="|Página ${usuarios.number+1} de ${usuarios.totalPages==0 ? 1 : usuarios.totalPages}|"></span><a th:if="${usuarios.hasNext()}" th:href="@{/usuarios(page=${usuarios.number+1})}">Siguiente</a></div>
</main></body></html>
