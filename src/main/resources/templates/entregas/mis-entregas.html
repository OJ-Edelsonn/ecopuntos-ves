<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis entregas | EcoPuntos VES</title>
<style>
:root{font-family:Arial,sans-serif;color:#1f2937;background:#f4f7f6}body{margin:0}
main{max-width:1050px;margin:25px auto;padding:24px;background:white;border-radius:12px;box-shadow:0 2px 14px #0001}
h1{font-size:1.6rem;margin-top:0}h2{font-size:1.1rem}a{color:#087f5b}
nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 22px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}
th{background:#eaf5ed}label{display:block;margin:12px 0 4px;font-weight:600}
input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9c5c0;border-radius:6px}
button,.boton{display:inline-block;width:auto;padding:10px 16px;border:0;border-radius:6px;background:#087f5b;color:#fff;text-decoration:none;cursor:pointer}
.alerta{padding:13px;margin:14px 0;border-radius:6px;background:#e6f6ed}.error{background:#fee2e2}
.ayuda{color:#52615c;font-size:14px}.paginacion{display:flex;gap:15px;margin-top:15px}
form.linea{display:inline}form.linea button{background:#455a64;padding:6px 9px}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
@media(max-width:700px){main{margin:8px;padding:12px}table{display:block;overflow-x:auto}}
</style>
</head><body><main><nav><a th:href="@{/}">Inicio</a><a th:href="@{/mi-perfil}">Mi perfil</a><a th:href="@{/mis-entregas}">Mis entregas</a>
<a th:href="@{/cambiar-clave}">Cambiar clave</a>
<form class="linea" method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Salir</button></form></nav>
<h1>Mis entregas</h1>
<p><strong>Saldo actual de puntos:</strong> <span th:text="${saldo}"></span></p>
<p class="ayuda">Solo puedes visualizar tus entregas y puntos. No se muestran datos de otros vecinos.</p>
<table><thead><tr><th>N.º</th><th>Fecha</th><th>Kilos</th><th>Puntos obtenidos</th></tr></thead>
<tbody><tr th:each="e : ${entregas.content}">
<td th:text="${e.id}"></td><td th:text="${#temporals.format(e.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
<td th:text="${e.kilosTotal}"></td><td th:text="${e.puntosOtorgados}"></td></tr>
<tr th:if="${entregas.empty}"><td colspan="4">Todavía no tienes entregas registradas.</td></tr>
</tbody></table>
<div class="paginacion"><a th:if="${entregas.hasPrevious()}" th:href="@{/mis-entregas(page=${entregas.number - 1})}">Anterior</a>
<span th:text="|Página ${entregas.number + 1} de ${entregas.totalPages == 0 ? 1 : entregas.totalPages}|"></span>
<a th:if="${entregas.hasNext()}" th:href="@{/mis-entregas(page=${entregas.number + 1})}">Siguiente</a></div>
</main></body></html>
