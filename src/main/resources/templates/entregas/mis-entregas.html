<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Mis entregas')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('mis-entregas')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 1060px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <h1 class="h3 fw-bold text-white mb-1">Mis entregas</h1>
        <p class="text-eco-muted mb-0">Historial de reciclables entregados y desglose de puntos por material.</p>
      </div>
      <div class="eco-card-neon py-2 px-4 d-flex align-items-center gap-3">
        <div>
          <div class="text-eco-muted small">Saldo disponible</div>
          <div class="h4 fw-bold text-eco-neon mb-0" th:text="|${saldo} puntos|">0 puntos</div>
        </div>
        <a class="btn btn-outline-eco btn-sm" th:href="@{/mis-puntos}">Ver movimientos</a>
      </div>
    </div>

    <div class="eco-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>N.º</th>
              <th>Fecha y hora</th>
              <th>Sector</th>
              <th class="text-end">Kilos entregados</th>
              <th class="text-end">Puntos obtenidos</th>
              <th class="text-end">Detalle</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="e : ${entregas.content}">
              <td class="text-eco-muted" th:text="${e.id}"></td>
              <td class="text-white" th:text="${#temporals.format(e.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
              <td><span class="badge bg-dark border border-secondary text-light" th:text="${e.sector.nombre}"></span></td>
              <td class="text-end" th:text="|${e.kilosTotal} kg|"></td>
              <td class="text-end fw-bold text-eco-neon" th:text="|+${e.puntosOtorgados}|"></td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-eco" th:href="@{/mis-entregas/{id}(id=${e.id})}">
                  Ver materiales
                </a>
              </td>
            </tr>
            <tr th:if="${entregas.empty}">
              <td colspan="6" class="text-center text-eco-muted py-4">Todavía no tienes entregas registradas.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex gap-3 align-items-center mt-3 pt-3 border-top border-secondary-subtle">
        <a class="btn btn-outline-secondary btn-sm" th:if="${entregas.hasPrevious()}"
           th:href="@{/mis-entregas(page=${entregas.number - 1})}">Anterior</a>
        <span class="small text-eco-muted"
              th:text="|Página ${entregas.number + 1} de ${entregas.totalPages == 0 ? 1 : entregas.totalPages}|"></span>
        <a class="btn btn-outline-secondary btn-sm" th:if="${entregas.hasNext()}"
           th:href="@{/mis-entregas(page=${entregas.number + 1})}">Siguiente</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
