<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Registrar entrega')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('entregas')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 880px;">
    <div class="mb-4">
      <h1 class="h3 fw-bold text-white mb-1">Registrar entrega de reciclables</h1>
      <p class="text-eco-muted mb-0">
        Ingresa el DNI del vecino y el peso de los materiales entregados. Deja en blanco los materiales que no correspondan.
      </p>
    </div>

    <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>

    <div class="eco-card">
      <form method="post" th:action="@{/entregas/nueva}" th:object="${form}">
        <div class="mb-4">
          <label for="dni" class="form-label">DNI del vecino registrado</label>
          <input id="dni" class="form-control" th:field="*{dniVecino}" type="text"
                 inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required
                 placeholder="Ej.: 90863118" style="max-width: 320px;">
          <div class="form-text">
            Si el vecino aún no figura en el padrón, regístralo primero en
            <a th:href="@{/vecinos/nuevo}">Gestión de vecinos</a>.
          </div>
        </div>

        <div class="table-responsive mb-4">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Material reciclable</th>
                <th style="width: 240px;">Peso en kilogramos (kg)</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="m, iter : ${materiales}">
                <td class="fw-semibold text-white" th:text="${m.nombre}"></td>
                <td>
                  <input type="hidden" th:name="|materialIds[${iter.index}]|" th:value="${m.id}">
                  <input type="number" class="form-control" th:name="|kilos[${iter.index}]|"
                         min="0.01" max="99999.99" step="0.01" placeholder="0.00" inputmode="decimal"
                         th:value="${form.kilos != null and form.kilos.size() > iter.index ? form.kilos[iter.index] : ''}">
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="d-flex flex-wrap gap-2 pt-3 border-top border-secondary-subtle">
          <button type="submit" class="btn btn-eco">
            <i class="bi bi-check-circle me-1"></i> Registrar entrega y acreditar puntos
          </button>
          <a class="btn btn-outline-secondary" th:href="@{/entregas}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
