<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/menu :: head('Historial de entregas')}"></head>
<body>

<div th:replace="~{fragmentos/menu :: sidebar('entregas')}"></div>

<main class="eco-main">
  <div class="container-fluid" style="max-width: 1120px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h3 fw-bold text-white mb-1">Entregas de reciclaje</h1>
        <p class="text-eco-muted mb-0">Consulta de pesajes registrados y acceso al registro de nuevas entregas.</p>
      </div>
      <a class="btn btn-eco" th:href="@{/entregas/nueva}">
        <i class="bi bi-plus-circle me-1"></i> Registrar entrega
      </a>
    </div>

    <div th:if="${mensaje}" class="alert alert-eco mb-3" th:text="${mensaje}"></div>

    <div class="eco-card mb-4">
      <form method="get" th:action="@{/entregas}" class="row g-3 align-items-end">
        <div class="col-md-5">
          <label for="dni" class="form-label">Filtrar por DNI de vecino</label>
          <input id="dni" name="dni" class="form-control" maxlength="8" inputmode="numeric"
                 th:value="${dni}" placeholder="Ej.: 90863118">
        </div>
        <div class="col-md-4">
          <label for="orden" class="form-label">Ordenar entregas</label>
          <select id="orden" name="orden" class="form-select">
            <option value="numeroAsc" th:selected="${orden == 'numeroAsc'}">N.º ascendente (1, 2, 3...)</option>
            <option value="recientes" th:selected="${orden == 'recientes'}">Más recientes primero</option>
          </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button type="submit" class="btn btn-eco w-100">
            <i class="bi bi-funnel me-1"></i> Aplicar
          </button>
          <a th:if="${!#strings.isEmpty(dni)}" class="btn btn-outline-secondary" th:href="@{/entregas}">
            Limpiar
          </a>
        </div>
      </form>
    </div>

    <div class="eco-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>N.º</th>
              <th>Fecha y hora</th>
              <th>Vecino</th>
              <th>DNI</th>
              <th class="text-end">Kilos</th>
              <th class="text-end">Puntos</th>
              <th class="text-end">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="e : ${entregas.content}">
              <td class="text-eco-muted" th:text="${e.id}"></td>
              <td th:text="${#temporals.format(e.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
              <td class="fw-semibold text-white" th:text="${e.vecino.usuario.nombreCompleto}"></td>
              <td th:text="${e.vecino.dni}"></td>
              <td class="text-end" th:text="|${e.kilosTotal} kg|"></td>
              <td class="text-end fw-bold text-eco-neon" th:text="${e.puntosOtorgados}"></td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-eco" th:href="@{/entregas/{id}(id=${e.id})}">Detalle</a>
              </td>
            </tr>
            <tr th:if="${entregas.empty}">
              <td colspan="7" class="text-center text-eco-muted py-4">No existen entregas con esos criterios.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex gap-3 align-items-center mt-3 pt-3 border-top border-secondary-subtle">
        <a class="btn btn-outline-secondary btn-sm" th:if="${entregas.hasPrevious()}"
           th:href="@{/entregas(dni=${dni},orden=${orden},page=${entregas.number - 1})}">Anterior</a>
        <span class="small text-eco-muted"
              th:text="|Página ${entregas.number + 1} de ${entregas.totalPages == 0 ? 1 : entregas.totalPages} · ${entregas.totalElements} entregas|"></span>
        <a class="btn btn-outline-secondary btn-sm" th:if="${entregas.hasNext()}"
           th:href="@{/entregas(dni=${dni},orden=${orden},page=${entregas.number + 1})}">Siguiente</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragmentos/menu :: scripts}"></div>
</body>
</html>
